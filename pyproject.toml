[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "dynfarm"
dynamic = ["version"]
description = "Command-line client for the Dynapps Agent Farm API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dynapps" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# Exact pins, as in the farm's own requirements.txt: what CI tested is what a person installs. `dynfarm` is
# installed as a tool in its own environment (uv tool, pipx), so exact pins cannot clash with anything.
dependencies = [
    "click==8.5.0",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "platformdirs==4.13.5",
    "tomli-w==1.2.0",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

# The key is the command people type. It must equal `dynfarm._brand.NAME` (tests/test_brand.py).
[project.scripts]
dynfarm = "dynfarm.cli:main"

[tool.hatch.version]
path = "src/dynfarm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dynfarm"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Coverage is not in addopts on purpose: the CI `test` job runs `pytest --cov`; a single test file run locally must not
# fail for the coverage of the files it does not exercise.
filterwarnings = ["error::DeprecationWarning:dynfarm"]

[tool.coverage.run]
source_pkgs = ["dynfarm"]
branch = true

[tool.coverage.report]
# The floor of the CI `test` job, the only place it is written. Measured with branches: 97.5 %; the floor is that figure
# rounded down to the nearest 5, so a change that leaves a command untested turns the pipeline red. Raise it when the
# measure rises by 5, never lower it to get a change through.
fail_under = 95
show_missing = true
skip_covered = true
