# The suite on the three operating systems people install `dynfarm` on. What each job guards is in CONTRIBUTING.md
# ("CI").
#
# Development happens on a private GitLab with Linux runners only; a push mirror copies `main` and the tags here, where
# GitHub offers Linux, Windows and macOS runners for free. So this workflow is where the code first runs on Windows and
# macOS, and it is also the gate of a release: release.yml calls it (`workflow_call`) before it builds anything, and a
# red cell on any system stops the publication.
#
#   test     the whole suite, with the coverage floor of pyproject.toml, on Linux, Windows and macOS x Python 3.11 and
#            3.14 (the oldest and the newest supported). Ruff runs once, on Linux with the newest Python.
#   install  the built wheel and sdist in a fresh virtual environment on each system, driven as a person would: the
#            installed script, `--help`, and `python -m dynfarm`.
#
# It reads the repository and nothing else: no secret, no write access, no identity token. Every action is pinned to a
# full commit SHA (a tag can be moved, a SHA cannot); the version it stands for is in the comment, and
# tests/test_packaging.py checks the pins and the permissions.

name: ci

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# `bash` everywhere, Windows included (Git Bash is on the Windows runners): one syntax for every command below.
defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A failure on one system must not hide what the others say: the first run on a new system tells the most.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          ruff check .
          ruff format --check .
      # The coverage floor is `fail_under` in pyproject.toml; pytest-cov reads it. The end-to-end tests run the
      # `dynfarm` script this install put next to the interpreter, in a subprocess, against a fake farm on a socket.
      - name: Test
        run: python -m pytest -q --cov=dynfarm

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the build tools (pinned in the dev extra)
        run: python -m pip install '.[dev]'
      - name: Build the sdist and the wheel
        run: |
          python -m build
          twine check dist/*
      # A virtual environment puts its scripts in `bin` on Linux and macOS, and in `Scripts` as `.exe` files on Windows.
      - name: Install the wheel in a fresh environment and run it
        run: |
          python -m venv .from-wheel
          if [ "$RUNNER_OS" = "Windows" ]; then scripts=.from-wheel/Scripts exe=.exe; else scripts=.from-wheel/bin exe=; fi
          "$scripts/python$exe" -m pip install dist/*.whl
          "$scripts/python$exe" -m pip check
          "$scripts/dynfarm$exe" --version
          "$scripts/dynfarm$exe" --help
          "$scripts/dynfarm$exe" task --help
          "$scripts/python$exe" -m dynfarm --version
          "$scripts/python$exe" -m dynfarm task --help
          "$scripts/dynfarm$exe" completion bash > /dev/null
      - name: Install the sdist in another fresh environment and run it
        run: |
          python -m venv .from-sdist
          if [ "$RUNNER_OS" = "Windows" ]; then scripts=.from-sdist/Scripts exe=.exe; else scripts=.from-sdist/bin exe=; fi
          "$scripts/python$exe" -m pip install dist/*.tar.gz
          "$scripts/dynfarm$exe" --version
          "$scripts/python$exe" -m dynfarm --version
