# Publishes a release: a tag `v<version>` becomes a PyPI release and a GitHub Release. Nothing else runs here.
#
# This repository is a read-only mirror of the private project where `dynfarm` is developed; the mirror pushes `main`
# and the tags, and a tag is the only thing that starts this workflow. What it does, in order:
#
#   verify          the tag is the package version and the changelog has its section (tools/check_tag.py), then lint
#                   and the whole test suite. A red tree is never published.
#   build           the sdist and the wheel, checked with `twine check`, uploaded as one artifact.
#   publish         uploads that artifact to PyPI with Trusted Publishing (OIDC): no API token exists anywhere. It is the
#                   only job with `id-token: write`, and it runs in the `pypi` environment, which is restricted to
#                   `v*` tags in the repository settings.
#   github-release  the GitHub Release, with the changelog section as notes and the files attached. The only job with
#                   `contents: write`.
#
# PyPI accepts a version once. If `publish` failed after uploading, do not re-run it: fix forward with the next patch
# version. See "Releasing" in CONTRIBUTING.md, including the one-time trusted-publisher setup on PyPI.
#
# Every action is pinned to a full commit SHA (a tag can be moved, a SHA cannot); the version it stands for is in the
# comment. tests/test_packaging.py checks the pins, the permissions and the order of the jobs.

name: release

on:
  push:
    tags: ["v*"]

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # First, before anything is installed: a bad tag must fail in seconds, not after the whole suite.
      - name: The tag is the package version and the changelog has its section
        run: python tools/check_tag.py "$GITHUB_REF_NAME"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # The coverage floor is `fail_under` in pyproject.toml; pytest-cov reads it.
      - name: Test
        run: python -m pytest -q --cov=dynfarm

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the build tools (pinned in the dev extra)
        run: pip install '.[dev]'
      - name: Build the sdist and the wheel
        run: python -m build
      - name: Check the metadata PyPI will read
        run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dynfarm
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload credential; nothing else is granted
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes (the changelog section of this version)
        run: python3 tools/check_tag.py "$GITHUB_REF_NAME" --notes release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release tag (v1.2.0rc1) is marked as such; only vX.Y.Z is a final release.
          flags=""
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "dynfarm $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $flags
